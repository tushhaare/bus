<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bus Entry</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: sans-serif;
}

.app {
  max-width: 420px;
  margin: auto;
  position: relative;
}

/* Image */
.main-img {
  width: 100%;
  display: block;
}

/* Bus number boxes */
.box {
  width: 32px;
  height: 40px;
  text-align: center;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  background: transparent;
}

/* Route input */
.route-input {
  position: absolute;
  height: 45px;
  border-radius: 10px;
  border: none;
  padding: 10px;
  font-size: 16px;
  background: transparent;
  outline: none;
}

/* Click button */
.btn {
  position: absolute;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">

  <!-- Background Screenshot -->
  <img src="images/bus-entry.png" class="main-img">

  <!-- BUS INPUT -->
  <div style="position:absolute; top:200px; left:32px; display:flex; gap:10px;">
    <input class="box" maxlength="1" id="b1">
    <input class="box" maxlength="1" id="b2">
    <input class="box" maxlength="1" id="b3">
    <input class="box" maxlength="1" id="b4">
    <input class="box" maxlength="1" id="b5">
    <input class="box" maxlength="1" id="b6">
    <input class="box" maxlength="1" id="b7">
    <input class="box" maxlength="1" id="b8">
  </div>

  <!-- ROUTE INPUT -->
  <input id="routeInput"
         class="route-input"
         placeholder="e.g. 53"
         style="top:432px; left:40px; width:370px;">
<input id="towardsInput"
       placeholder="towards"
       style="
         position:absolute;
         top:580px;
         left:35px;
         width:240px;
         font-size:17px;
         color:#555;
       ">

       

<div id="nextBtn"
     style="
       position: fixed;
       bottom: 20px;
       left: 50%;
       transform: translateX(-50%);
       width: 90%;
       max-width: 380px;
       height: 55px;
       background: #2aa7a9;
       color: white;
       text-align: center;
       line-height: 55px;
       border-radius: 12px;
       font-size: 18px;
       display: none;
       z-index: 1000;
     "
     onclick="goNext()">
  Next
</div>

<script>

// ===== BUS BOXES =====
const boxes = ["b1","b2","b3","b4","b5","b6","b7","b8"];

// Auto move cursor
boxes.forEach((id, index) => {

  const box = document.getElementById(id);

  box.addEventListener("input", function(){

    this.value = this.value.toUpperCase();

    if(this.value && index < boxes.length - 1){
      document.getElementById(boxes[index + 1]).focus();
    }

    checkInput();

  });

});

// ===== SHOW / HIDE NEXT BUTTON =====
function checkInput(){

  const bus = boxes
    .map(id => document.getElementById(id).value)
    .join("")
    .trim();

  const route = document.getElementById("routeInput").value.trim();

  const nextBtn = document.getElementById("nextBtn");

  if(bus.length >= 7 || route.length >= 2){
    nextBtn.style.display = "block";
  } else {
    nextBtn.style.display = "none";
  }

}

// Route listener
document.getElementById("routeInput")
  .addEventListener("input", checkInput);

document.getElementById("towardsInput")
  .addEventListener("input", checkInput);

// ===== NEXT BUTTON =====
function goNext(){

  const bus = boxes
    .map(id => document.getElementById(id).value)
    .join("")
    .trim();

  const route =
    document.getElementById("routeInput").value.trim();

  const towards =
    document.getElementById("towardsInput").value.trim();

  const validBus =
    bus.length >= 7 && bus.length <= 8;

  const validRoute =
    route.length >= 2;

  if(!validBus && !validRoute){
    alert("Enter Bus Number or Route Number");
    return;
  }

  const bookingData = {
    bus: validBus ? bus : "",
    route: route,
    towards: towards,
    type: validBus ? "bus" : "route"
  };

  localStorage.setItem(
    "bookingData",
    JSON.stringify(bookingData)
  );

  console.log("Saved:", bookingData);

  window.location.href = "ticket-form.html";

}

// Initial state
checkInput();

</script>
